# Railway — optima-ai-backend
# Service "Root Directory" should be: optima-ai-backend (full git repo cloned; parent has src/lib for orchestrator)

[build]
buildCommand = "npm ci && npm run build"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
